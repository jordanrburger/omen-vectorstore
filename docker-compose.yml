version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./state/qdrant_data:/qdrant/storage
    environment:
      - QDRANT_ALLOW_CORS=true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./state:/app/state
    environment:
      - QDRANT_HOST=qdrant
      - PYTHONPATH=/app
    depends_on:
      - qdrant
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  # Uncomment to include a UI for Qdrant
  # qdrant-ui:
  #   image: qdrant/qdrant-web-ui:latest
  #   ports:
  #     - "8080:80"
  #   environment:
  #     - API_URL=http://localhost:6333
  #   depends_on:
  #     - qdrant
  #   restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/qdrant_data
      o: bind
